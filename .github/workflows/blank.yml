name: auto-merge-intercom-docs-sync

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'intercom/docs-sync/')
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      DOCS_PATH: intercom/
      SYNC_AUTHOR: fin-github-sync[bot]
    steps:
      - name: Gate on author + docs-only diff
        id: gate
        run: |
          set -euo pipefail
          author='${{ github.event.pull_request.user.login }}'
          norm() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed 's/\[bot\]$//'; }
          if [ "$(norm "$author")" != "$(norm "$SYNC_AUTHOR")" ]; then
            echo "author '$author' is not the sync app — skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR}/files" --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "no changed files — skipping"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed files:"; echo "$files"

          while IFS= read -r f; do
            case "$f" in
              "$DOCS_PATH"*) ;;
              *) echo "non-docs file '$f' — skipping"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done <<< "$files"

          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge (fall back to direct merge)
        if: steps.gate.outputs.ok == 'true'
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          pr_id=$(gh api graphql -f query='
            query($o:String!,$r:String!,$n:Int!){
              repository(owner:$o,name:$r){pullRequest(number:$n){id}}
            }' -F o="$owner" -F r="$repo" -F n="$PR" --jq '.data.repository.pullRequest.id')

          if gh api graphql -f query='
            mutation($id:ID!){
              enablePullRequestAutoMerge(input:{pullRequestId:$id, mergeMethod:SQUASH}){
                pullRequest{ autoMergeRequest{ enabledAt } }
              }
            }' -F id="$pr_id" 2>/dev/null; then
            echo "auto-merge enabled — will merge when checks/reviews pass"
          else
            echo "auto-merge not applicable (nothing pending) — merging directly"
            gh api --method PUT "repos/${owner}/${repo}/pulls/${PR}/merge" -f merge_method=squash
          fi
